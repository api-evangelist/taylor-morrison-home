description: >-
  Taylor Morrison Home Corporation (NYSE: TMHC) is a leading national homebuilder and developer recognized as America's
  Most Trusted Home Builder for eleven consecutive years. Taylor Morrison designs and constructs single-family homes,
  communities, and lifestyle developments across the US. Their digital platform enables fully online home purchase,
  customization, and reservation — including floor plan selection, lot choice, interior design, and digital closing.
  They integrate with Offerpad for trade-ins, Taylor Morrison Home Funding (TMHF) for mortgages, and multiple proptech
  partners.

naftiko: 1.0.0-alpha2
info:
  label: Taylor Morrison Home Search API — Lots
  description: 'Taylor Morrison Home Search API — Lots. 1 operations. Lead operation: List Available Lots. Self-contained
    Naftiko capability covering one Taylor Morrison Home business surface.'
  tags:
  - Taylor Morrison Home
  - Lots
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TAYLOR_MORRISON_HOME_API_KEY: TAYLOR_MORRISON_HOME_API_KEY
capability:
  consumes:
  - type: http
    namespace: search-lots
    baseUri: https://www.taylormorrison.com/api
    description: Taylor Morrison Home Search API — Lots business capability. Self-contained, no shared references.
    resources:
    - name: lots
      path: /lots
      operations:
      - name: listlots
        method: GET
        description: List Available Lots
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: community_id
          in: query
          type: string
          description: Community to list lots for
          required: true
        - name: status
          in: query
          type: string
          description: Lot availability status
    authentication:
      type: apikey
      key: X-API-Key
      value: '{{env.TAYLOR_MORRISON_HOME_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: search-lots-rest
    port: 8080
    description: REST adapter for Taylor Morrison Home Search API — Lots. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/lots
      name: lots
      description: REST surface for lots.
      operations:
      - method: GET
        name: listlots
        description: List Available Lots
        call: search-lots.listlots
        with:
          community_id: rest.community_id
          status: rest.status
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: search-lots-mcp
    port: 9090
    transport: http
    description: MCP adapter for Taylor Morrison Home Search API — Lots. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-available-lots
      description: List Available Lots
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: search-lots.listlots
      with:
        community_id: tools.community_id
        status: tools.status
      outputParameters:
      - type: object
        mapping: $.
